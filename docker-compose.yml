#local postgressql dw 
services:
  postgres:
    image: postgres:16
    container_name: nyc_taxi_postgres
    restart: unless-stopped
    env_file: .env
    ports:  
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes: 
      - pg_data:/var/lib/postgresql/data
      - ./data/raw:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:      